# The host tools of bebash's dev environment. The flake, the hooks, and the
# recipes own every other tool. The justfile checks these with
# `exobrain host-check` in the first line of each recipe that uses them, and
# the host-requirements hook of exobrain-tech parses this file at commit.
schema = 1

# The CLI of exobrain-tech: the hook hook-revisions calls `exobrain hooks
# check`, the recipes call `exobrain host-check`, and `.envrc` calls
# `exobrain outdated`. 2.0.0 is the first release that carries `outdated`.
[tools.exobrain]
version = ">=2.0.0"

[tools.git]

[tools.nix]

# prek owns its own floor: minimum_prek_version in .pre-commit-config.yaml.
[tools.prek]
version = "*"
