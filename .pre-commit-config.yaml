# Pre-commit configuration for bebash — a Bash framework + management CLI.
#
# Authoritative spec: docs/reference/tooling.md ("## .pre-commit-config.yaml
# hooks"). The docs Diátaxis shelf is the source of truth; this file implements
# that hook table verbatim (scopes, tools, flags) and aligns with the shared
# .editorconfig baseline (2-space sh/bash/bats; markdown keeps hard-break
# trailing whitespace).
#
# Shell scope (shellcheck + shfmt) — the exact file set from the docs table:
#   bin/*, lib/**/*.bash, libexec/**/*.bash, functions/**/*.bash, rc.d/**/*.bash,
#   install*.sh, uninstall.sh, test/**/*.bash
#
# External tool notes:
#   - shellcheck reads .shellcheckrc (external-sources, source-path, disable=SC1091)
#     and runs with -x to follow sourced files.
#   - the local test hooks run bats from the dev shell with the
#     bats-support/assert/file helpers vendored in test/test_helper/
#     (see docs/reference/testing.md).

default_install_hook_types: [pre-commit, commit-msg, pre-push]

# The pre-commit and pre-push stages together run every check of CI, and the
# pre-push stage repeats none of the pre-commit stage. A hook with no `stages`
# runs only at pre-commit. An upstream manifest that names its own `stages`
# wins over this default, so each such hook below sets `stages: [pre-commit]`.
# See docs/reference/tooling.md ("Hook stages and CI").
default_stages: [pre-commit]

repos:
  # --- Generic housekeeping (pre-commit/pre-commit-hooks) ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        files: '\.ya?ml$'
      - id: check-toml   # cliff.toml, committed.toml
      # Vendored bats helper libraries (test/test_helper/bats-*) are pinned to
      # upstream releases (see test/test_helper/VENDORED.md) and must not be
      # rewritten to local style; they are excluded from the housekeeping,
      # editorconfig, and shellcheck hooks below.
      #
      # A generated file follows its generator, so the two fixers also skip
      # git-cliff's CHANGELOG.md and nix's flake.lock: `just release` commits
      # the changelog exactly as git-cliff writes it, and end-of-file-fixer
      # rewrites that output. typos (_typos.toml) and editorconfig-checker
      # (.editorconfig-checker.json) exclude the same two files in their own
      # configuration. See docs/reference/tooling.md.
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '^(test/test_helper/bats-|CHANGELOG\.md$|flake\.lock$)'
      - id: trailing-whitespace
        stages: [pre-commit]
        # Markdown keeps two-space hard breaks (.editorconfig: *.md sets
        # trim_trailing_whitespace = false).
        args: [--markdown-linebreak-ext=md]
        exclude: '^(test/test_helper/bats-|CHANGELOG\.md$|flake\.lock$)'
      # Cheap safety hooks.
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        stages: [pre-commit]
        args: [--maxkb=2048]
      - id: detect-private-key
      # Sourced libs carry no shebang and are not executable; executables
      # (bin/bebash, install*.sh) carry a shebang and the exec bit. These two
      # hooks enforce exactly that. Vendored bats libraries are exempt.
      - id: check-executables-have-shebangs
        stages: [pre-commit]
        exclude: '^test/test_helper/bats-'
      - id: check-shebang-scripts-are-executable
        stages: [pre-commit]
        exclude: '^test/test_helper/bats-'
      # master is written only by CI (ADR-0015); develop stays writable.
      - id: no-commit-to-branch
        args: [--branch, master]

  # --- EditorConfig conformance (aligned with the shared .editorconfig) ---
  - repo: https://github.com/editorconfig-checker/editorconfig-checker
    rev: v3.8.0
    hooks:
      - id: editorconfig-checker
        alias: ec
        # end-of-file-fixer owns final newlines; LICENSE is exempt. Markdown is
        # excluded: editorconfig-checker can't parse fenced-block interiors and
        # would fight the *.md trailing-whitespace exemption.
        args: [-disable-insert-final-newline, -exclude, LICENSE]
        # Markdown excluded (see above); vendored bats libraries keep upstream
        # tab indentation and are exempt from the local space baseline.
        exclude: '(\.md$|^test/test_helper/bats-)'

  # --- ShellCheck static analysis (shellcheck-py, -x) ---
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]   # follow sourced files (source-path from .shellcheckrc)
        files: '^(bin/[^/]+|lib/.*\.bash|libexec/.*\.bash|functions/.*\.bash|rc\.d/.*\.bash|install[^/]*\.sh|uninstall\.sh|test/.*\.bash)$'
        # Vendored bats libraries carry upstream shellcheck findings we do not own.
        exclude: '^test/test_helper/bats-'

  # --- shfmt formatter (pre-commit-shfmt) ---
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.1-1
    hooks:
      - id: shfmt
        stages: [pre-commit]
        # Canonical flags from docs/reference/tooling.md: 2-space indent,
        # switch-case indent, binary ops at line start, simplify.
        args: [-i, '2', -ci, -bn, -s]
        files: '^(bin/[^/]+|lib/.*\.bash|libexec/.*\.bash|functions/.*\.bash|rc\.d/.*\.bash|install[^/]*\.sh|uninstall\.sh|test/.*\.bash)$'

  # --- shellharden: auto-quote variables and command substitutions ---
  # language: system — shellharden is provided by the Nix devShell (flake.nix),
  # like the local bats hooks. Same shell scope as shellcheck/shfmt.
  - repo: local
    hooks:
      - id: shellharden
        name: shellharden
        language: system
        entry: shellharden --replace
        files: '^(bin/[^/]+|lib/.*\.bash|libexec/.*\.bash|functions/.*\.bash|rc\.d/.*\.bash|install[^/]*\.sh|uninstall\.sh|test/.*\.bash)$'
        exclude: '^test/test_helper/bats-'

  # --- bashate: shell style checker ---
  # Scoped to the executable entrypoints only: sourced lib/*.bash carry no
  # shebang by convention (docs/reference/tooling.md "Strict mode"), so running
  # bashate's shebang check over them would be wrong.
  - repo: https://github.com/openstack/bashate
    rev: 2.1.1
    hooks:
      - id: bashate
        # Ignore E003 (indent not a multiple of four — bebash uses 2-space, per
        # shfmt) and E006 (long lines — owned by shfmt/editor).
        args: [-i, 'E003,E006']
        files: '^(bin/bebash|install[^/]*\.sh|uninstall\.sh)$'

  # --- Markdown lint/format (markdownlint-cli2) ---
  # Scoped to the docs shelf. MD040 (fenced code blocks must declare a language)
  # is the highlighted rule; it is enabled by markdownlint's default rule set.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.0
    hooks:
      - id: markdownlint-cli2
        files: '^docs/.*\.md$'
        # Build the hook on the node of the devshell. pre-commit cannot
        # download a node from a clean environment (nodeenv fails).
        language_version: system

  # --- gitleaks: secret scanner ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        pass_filenames: false   # gitleaks manages its own scanning scope
        stages: [pre-commit]

  # --- typos: spell checker (report-only) ---
  # No --write-changes: typos auto-fix silently rewrites deliberate identifiers
  # (__ui_*/__log_* namespaces, err.kind strings). Fix real typos by hand;
  # allowlist false positives in _typos.toml.
  - repo: https://github.com/crate-ci/typos
    rev: v1.48.0
    hooks:
      - id: typos
        stages: [pre-commit]

  # --- committed: Conventional Commits linter (commit-msg) ---
  # Local enforcement of the commit contract the release flow assumes
  # (ADR-0013/0017). Config source of truth: committed.toml.
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  # --- Tests (local bats) ---
  # Unit tests gate every commit; integration tests gate pushes. Untagged tests
  # run in the unit lane; tag a test `# bats test_tags=integration` to defer it
  # to the pre-push lane. See docs/reference/testing.md.
  - repo: local
    hooks:
      - id: test-unit
        name: bats unit tests
        language: system
        entry: bats --recursive --filter-tags '!integration' test
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: test-integration
        name: bats integration tests
        language: system
        entry: bats --recursive --filter-tags integration test
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The whole suite under each bash that bebash supports. Each
      # `bats-bash-*` package of flake.nix holds that bash and a bats whose
      # shebangs point at it. The first push builds them, and the store keeps
      # them.
      - id: test-bash-versions
        name: bats suite under bash 4.4, 5.0, and 5.2
        language: system
        entry: >-
          bash -euo pipefail -c '
          for v in 4_4 5_0 5_2; do
          out=$(nix build --no-link --print-out-paths ".#bats-bash-$v");
          "$out/bin/bash" --version | head -n 1;
          PATH="$out/bin:$PATH" bats --recursive test;
          done'
        pass_filenames: false
        always_run: true
        stages: [pre-push]
