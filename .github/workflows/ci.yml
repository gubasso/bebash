# CI — the two hook stages of bebash, in the Nix devShell.
#
# The pre-commit and pre-push stages of .pre-commit-config.yaml together hold
# every check of this workflow, so a push that passed the local hooks passes CI
# (docs/reference/tooling.md, "Hook stages and CI"). Each job runs one stage
# with the same command that a developer runs. This is a Bash project: there is
# no compiler/build step, so there is no `build` job.
#
# The `test` job runs the pre-push stage: the integration tests, and the whole
# bats suite under bash 4.4, 5.0, and 5.2 (hook `test-bash-versions`). The
# flake builds each bash from its GNU tarball. bats' test helpers
# (bats-support/-assert/-file) are vendored in test/test_helper/ (VENDORED.md).
name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v2
      # The hook runner is a host tool, so the job installs it outside the
      # devshell, at the version the hosts run, and `nix develop` keeps it
      # on PATH. The action is pinned by commit SHA (https://prek.j178.dev/ci/).
      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: 0.5.7
      - name: Pre-commit stage
        run: nix develop --command prek run --all-files

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v2
      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: 0.5.7
      - name: Pre-push stage
        run: nix develop --command prek run --all-files --hook-stage pre-push
