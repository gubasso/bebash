# CI — the two hook stages of bebash, in the Nix devShell.
#
# The pre-commit and pre-push stages of .pre-commit-config.yaml together hold
# every check of this workflow, so a push that passed the local hooks passes CI
# (docs/reference/tooling.md, "Hook stages and CI"). Each job runs one stage,
# without the group local-only, whose hooks judge only a local git action.
# This is a Bash project: there is no compiler/build step, so there is no
# `build` job.
#
# The `test` job runs the pre-push stage: the integration tests, and the whole
# bats suite under bash 4.4, 5.0, and 5.2 (hook `test-bash-versions`). The
# flake builds each bash from its GNU tarball. bats' test helpers
# (bats-support/-assert/-file) are vendored in test/test_helper/ (VENDORED.md).
name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v2
      # The hook runner is a host tool, so the job installs it outside the
      # devshell, at the version the hosts run, and `nix develop` keeps it
      # on PATH. The action is pinned by commit SHA (https://prek.j178.dev/ci/).
      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: 0.5.7
      # The hooks call the exobrain CLI, a host tool, so the job installs the
      # release that the exobrain-tech entry of .pre-commit-config.yaml pins
      # and verifies its attestation. yq and gh come with the runner.
      - name: Install the exobrain CLI of the pinned exobrain-tech tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(yq '.repos[] | select(.repo | test("/exobrain-tech(\.git)?/?$")) | .rev' .pre-commit-config.yaml)
          asset=exobrain-x86_64-unknown-linux-gnu.tar.xz
          gh release download "$tag" --repo gubasso/exobrain-tech --pattern "$asset" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo gubasso/exobrain-tech
          mkdir -p "$RUNNER_TEMP/exobrain"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/exobrain" --strip-components=1
          echo "$RUNNER_TEMP/exobrain" >> "$GITHUB_PATH"
      # The group local-only holds the hooks that only a local git action can
      # judge, such as no-commit-to-branch. A group filter with no --stage
      # also runs the manual hooks, so each step names its stage.
      - name: Pre-commit stage
        run: nix develop --command prek run --all-files --stage pre-commit --no-group local-only

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: DeterminateSystems/magic-nix-cache-action@v2
      - name: Install prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          install-only: true
          prek-version: 0.5.7
      # The hooks call the exobrain CLI, a host tool, so the job installs the
      # release that the exobrain-tech entry of .pre-commit-config.yaml pins
      # and verifies its attestation. yq and gh come with the runner.
      - name: Install the exobrain CLI of the pinned exobrain-tech tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(yq '.repos[] | select(.repo | test("/exobrain-tech(\.git)?/?$")) | .rev' .pre-commit-config.yaml)
          asset=exobrain-x86_64-unknown-linux-gnu.tar.xz
          gh release download "$tag" --repo gubasso/exobrain-tech --pattern "$asset" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$asset" --repo gubasso/exobrain-tech
          mkdir -p "$RUNNER_TEMP/exobrain"
          tar -xJf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/exobrain" --strip-components=1
          echo "$RUNNER_TEMP/exobrain" >> "$GITHUB_PATH"
      - name: Pre-push stage
        run: nix develop --command prek run --all-files --stage pre-push --no-group local-only
